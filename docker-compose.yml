services:
  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_manager
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./ExpenseManagerBackend/ExpenseManagerBackend-main
    container_name: expense-backend
    restart: always
    env_file:
      - ./ExpenseManagerBackend//ExpenseManagerBackend-main/.env
    environment:
      DATASOURCE_URL: jdbc:mysql://mysql:3306/expense_manager?useSSL=false&allowPublicKeyRetrieval=true
      DATASOURCE_USERNAME: root
      DATASOURCE_PASSWORD: root
      SERVER_PORT: 8080
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./expense-manager-frontend
    container_name: expense-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
